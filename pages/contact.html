<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Leasing Schweiz</title>
  <meta name="description" content="Simple car leasing in Switzerland.">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="../index.html">Leasing Schweiz</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Main"><ul><li><a href="../index.html">Home</a></li><li><a href="../pages/how-leasing-works.html">How leasing works</a></li><li><a href="../pages/costs.html">Costs</a></li><li><a href="../pages/faq.html">FAQ</a></li><li><a href="../pages/contact.html" aria-current="page">Contact</a></li></ul></nav>
  </header>
  <main id="main">
    <h1>Contact</h1>
    <p>Questions about leasing? Fill in the form below. This is a demonstration site, so nothing is sent anywhere.</p>
    <form id="contact-form" novalidate>
      <p><label for="name">Name</label><br><input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-err"><br><span id="name-err" class="error" role="alert"></span></p>
      <p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><br><span id="email-err" class="error" role="alert"></span></p>
      <p><label for="topic">Topic</label><br>
        <select id="topic" name="topic">
          <option>General question about leasing</option>
          <option>Costs and rates</option>
          <option>End of contract</option>
        </select></p>
      <p><label for="message">Message</label><br><textarea id="message" name="message" rows="5" required aria-describedby="message-err"></textarea><br><span id="message-err" class="error" role="alert"></span></p>
      <p><button type="submit">Send message</button></p>
    </form>
    <p id="contact-status" role="status" aria-live="polite"></p>
  </main>
  <footer class="site-footer">
    <p>&copy; Leasing Schweiz. A demonstration site; not a real offer.</p>
  </footer>
  <script src="../js/nav.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
